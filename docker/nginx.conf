server {
    listen 8009;
    listen [::]:8009;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/csvs {
        client_max_body_size 2m;
        resolver 127.0.0.11 valid=10s;
        set $csv_backend csv-server;
        proxy_pass http://$csv_backend:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
